name: FitProgress checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend unit tests
        working-directory: backend
        run: npm test
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Start disposable PostgreSQL database
        run: docker compose up -d --wait
      - name: Start API for integration checks
        run: |
          nohup node backend/dist/index.js > /tmp/fitprogress-api.log 2>&1 < /dev/null &
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3001/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fitprogress-api.log
          exit 1
      - name: API integration tests (CRUD and invalid update)
        working-directory: backend
        run: |
          npm run test:api || { echo '--- API server logs ---'; cat /tmp/fitprogress-api.log; exit 1; }
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
